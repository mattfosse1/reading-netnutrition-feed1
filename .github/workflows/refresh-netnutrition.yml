name: Refresh Reading public dining menus

on:
  workflow_dispatch:
  push:
    paths:
      - reader.py
      - requirements.txt
      - tests/**
      - .github/workflows/refresh-netnutrition.yml
  schedule:
    # Three daily attempts (UTC); GitHub may delay scheduled starts.
    - cron: "17 6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: reading-netnutrition-data
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check parser against simulated CBORD responses
        run: python -m unittest discover -s tests -v

      - name: Install Chromium for browser fallback
        run: python -m playwright install chromium

      - name: Fetch Reading public menu data
        run: python reader.py --transport auto --output data --days 7 --max-menus 600

      - name: Commit successful public feed
        run: |
          git config user.name "Reading menu feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.csv data/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public NetNutrition menu snapshot"
            git pull --rebase
            git push
          fi
