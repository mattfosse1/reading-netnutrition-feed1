name: Enrich Reading menus with nutrition and ingredients

on:
  workflow_dispatch:
  push:
    paths:
      - labels.py
      - .github/workflows/enrich-netnutrition.yml
      - tests/test_labels.py
  schedule:
    # Spread small batches across the day rather than sending one large burst.
    - cron: "39 */2 * * *"

permissions:
  contents: write

concurrency:
  group: reading-netnutrition-data
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Test parser and incremental cache
        run: python -m unittest discover -s tests -v
      - name: Collect up to 350 missing nutrition labels
        env:
          CALL_DELAY_SECONDS: "0.5"
        run: python labels.py --max-labels 350
      - name: Publish successful incremental results
        run: |
          git config user.name "Reading menu feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/labels
          if ! git diff --cached --quiet; then
            git commit -m "Incrementally enrich Reading nutrition labels"
            git pull --rebase
            git push
          fi
