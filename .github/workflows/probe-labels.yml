name: Check public nutrition labels

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-labels.yml

permissions:
  contents: read

jobs:
  check-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Request two published dish labels, without changing the production menu feed
        run: python reader.py --transport http --days 1 --labels --max-labels 2 --output probe
      - name: Report diagnostic results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("probe/latest.json").read_text())
          print("Stats:", json.dumps(p["stats"]))
          for v in p["venues"]:
              for m in v["menus"]:
                  for c in m["categories"]:
                      for i in c["items"]:
                          if "label" in i or "labelError" in i:
                              print("Dish:", i["name"])
                              print("Label error:", i.get("labelError"))
                              print("Ingredients field preview:", i.get("label",{}).get("ingredients","")[:250])
                              print("Contains field preview:", i.get("label",{}).get("contains","")[:250])
                              print("Label text preview:", i.get("label",{}).get("labelText","")[:400])
          PY
